
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>আমার ফটো গ্যালারি</title>

    <meta name="description" content="আমার শৈশব থেকে বর্তমানের স্মৃতিময় মুহূর্তগুলোর ফটো গ্যালারি।">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Noto Sans Bengali", "Segoe UI", Tahoma, sans-serif;
            background: #f5f1eb;
            color: #3d342e;
            padding: 20px;
            min-height: 100vh;
        }

        .topbar {
            max-width: 1320px;
            margin: 0 auto 14px;
            display: flex;
            justify-content: flex-end;
        }

        .login-tab, .action-button, .login-submit {
            border: 0;
            border-radius: 999px;
            padding: 11px 18px;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .2s ease, background .2s ease;
        }

        .login-tab {
            color: #fffaf4;
            background: #71513d;
            box-shadow: 0 5px 15px rgba(73, 48, 32, .16);
        }
        .login-tab:hover, .action-button:hover, .login-submit:hover { transform: translateY(-1px); }

        header {
            position: relative;
            overflow: hidden;
            text-align: center;
            margin: 0 auto 30px;
            max-width: 1320px;
            padding: clamp(34px, 6vw, 68px) 22px;
            border: 1px solid rgba(162, 125, 91, .22);
            border-radius: 26px;
            background: radial-gradient(ellipse at top, #fffdf8 0%, #f2e5d5 70%, #ead7c2 100%);
            box-shadow: 0 12px 35px rgba(77, 54, 36, .08);
        }

        header::before, header::after {
            content: "♥";
            position: absolute;
            color: rgba(154, 103, 73, .13);
            font-size: clamp(70px, 12vw, 150px);
            line-height: 1;
            pointer-events: none;
        }
        header::before { left: 4%; top: 8%; transform: rotate(-18deg); }
        header::after { right: 5%; bottom: 0; transform: rotate(15deg); }

        .header-heart {
            display: inline-grid;
            place-items: center;
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            border-radius: 50%;
            background: #ead5c0;
            color: #965f47;
            font-size: 25px;
        }

        h1 {
            position: relative;
            z-index: 1;
            font-size: clamp(1.7rem, 4.5vw, 3.15rem);
            line-height: 1.45;
            margin-bottom: 10px;
            color: #4c382b;
        }

        header p {
            position: relative;
            z-index: 1;
            color: #846c5a;
            font-size: clamp(.92rem, 2vw, 1.08rem);
            line-height: 1.8;
        }

        .header-note {
            position: relative;
            z-index: 1;
            margin-top: 18px;
            color: #9a765e;
            font-size: 13px;
        }

        .login-panel {
            display: none;
            max-width: 520px;
            margin: 0 auto 22px;
            padding: 22px;
            border: 1px solid #e3d1bf;
            border-radius: 18px;
            background: #fffdf9;
            box-shadow: 0 12px 30px rgba(77, 54, 36, .10);
        }
        .login-panel.open { display: block; }
        .login-panel h2 { font-size: 1.25rem; color: #4c382b; margin-bottom: 8px; }
        .login-panel p { color: #77685d; font-size: 14px; line-height: 1.7; margin-bottom: 12px; }
        .password-input {
            display: block;
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d6c5b5;
            border-radius: 10px;
            font: inherit;
            margin: 10px 0 12px;
            background: #fff;
        }
        .login-submit { color: #fff; background: #71513d; }
        .login-error { min-height: 22px; margin-top: 9px; color: #a93226; font-size: 13px; }
        .admin-tools { display: none; margin-top: 18px; padding-top: 16px; border-top: 1px solid #eadfd4; }
        .admin-tools.visible { display: block; }
        .action-button { display: inline-block; text-decoration: none; color: #fff; background: #28744b; margin-bottom: 12px; }
        .account-note { font-size: 13px; color: #6d6259; line-height: 1.9; overflow-wrap: anywhere; }
        .account-note strong { color: #49372b; }

        .gallery {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(min(100%, 260px), 1fr)
            );
            gap: 22px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .photo-card {
            background: #fff;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.25s ease,
                        box-shadow 0.25s ease;
            min-width: 0;
        }

        .photo-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 9px 24px rgba(0, 0, 0, 0.13);
        }

        .photo-card img {
            display: block;
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #e9edf2;
            cursor: zoom-in;
        }

        .photo-name {
            padding: 12px;
            text-align: center;
            color: #526273;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .status {
            text-align: center;
            padding: 30px 12px;
            color: #526273;
            font-size: 1rem;
            line-height: 1.8;
        }

        .error {
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #a93226;
            background: #fff3f1;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .error small {
            margin-top: 8px;
            color: #7b5a56;
        }

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.92);
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 88vh;
            object-fit: contain;
        }

        .close-button {
            position: absolute;
            top: 14px;
            right: 22px;
            border: 0;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 28px;
            color: #fff;
            background: #303030;
            cursor: pointer;
        }

        footer {
            margin-top: 35px;
            padding: 15px;
            text-align: center;
            color: #87919b;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .topbar { margin-bottom: 10px; }
            .login-tab { padding: 10px 14px; font-size: 13px; }
            header { border-radius: 18px; margin-bottom: 20px; padding: 34px 15px; }
            .header-heart { width: 40px; height: 40px; font-size: 21px; }
            .header-note { font-size: 11px; }
            .login-panel { padding: 17px; border-radius: 14px; }
            .action-button { width: 100%; text-align: center; }

            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .photo-card {
                border-radius: 10px;
            }

            .photo-card img {
                height: 180px;
            }

            .photo-name {
                padding: 9px 5px;
                font-size: 12px;
            }
        }

        @media (max-width: 360px) {
            .gallery { grid-template-columns: 1fr; }
            .photo-card img { height: 240px; }
            h1 { font-size: 1.65rem; }
        }
    </style>
</head>

<body>

    <header>
        <h1>আমার শৈশব থেকে বর্তমানের গল্প</h1>
        <p>স্মৃতির পাতায় রাখা সকল মুহূর্ত</p>
    </header>

    <main>
        <div id="gallery-status" class="status" aria-live="polite">
            ছবিগুলো লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...
        </div>

        <section
            class="gallery"
            id="image-gallery"
            aria-label="আমার ছবির গ্যালারি"
        ></section>
    </main>

    <div
        class="lightbox"
        id="lightbox"
        role="dialog"
        aria-modal="true"
        aria-label="বড় আকারে ছবি দেখুন"
    >
        <button
            class="close-button"
            id="close-lightbox"
            type="button"
            aria-label="ছবি বন্ধ করুন"
        >×</button>

        <img id="lightbox-image" src="" alt="বড় আকারের ছবি">
    </div>

    <footer>
        আমার স্মৃতির অ্যালবাম © <span id="current-year"></span>
    </footer>

    <script>
        "use strict";

        // GitHub repository-এর images ফোল্ডার থেকে ছবির তালিকা স্বয়ংক্রিয়ভাবে নেওয়া হবে।
        const GITHUB_API = "https://api.github.com/repos/abdulsaifsardar/Abdullah-Al-Saif-Photo-Gallery/contents/images?ref=main";
        const ALLOWED_IMAGE = /\.(jpe?g|jfif|png|webp|gif|bmp|avif)$/i;

        const gallery = document.getElementById("image-gallery");
        const status = document.getElementById("gallery-status");
        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightbox-image");
        const closeButton = document.getElementById("close-lightbox");
        const loginTab = document.getElementById("login-tab");
        const loginPanel = document.getElementById("login-panel");
        const loginForm = document.getElementById("login-form");
        const adminPassword = document.getElementById("admin-password");
        const loginError = document.getElementById("login-error");
        const adminTools = document.getElementById("admin-tools");
        // Client-side convenience gate only; source code can be inspected by visitors.
        const ADMIN_PASSWORD = "Misiw@01726343655";

        loginTab.addEventListener("click", function () {
            const isOpen = loginPanel.classList.toggle("open");
            loginTab.setAttribute("aria-expanded", String(isOpen));
            if (isOpen) adminPassword.focus();
        });

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();
            if (adminPassword.value === ADMIN_PASSWORD) {
                loginError.textContent = "";
                adminTools.classList.add("visible");
                adminPassword.value = "";
                loginTab.textContent = "✓ Admin Access";
            } else {
                adminTools.classList.remove("visible");
                loginError.textContent = "পাসওয়ার্ড সঠিক নয়। আবার চেষ্টা করুন।";
                adminPassword.select();
            }
        });

        let loadedCount = 0;
        let failedCount = 0;
        let totalCount = 0;

        document.getElementById("current-year").textContent = new Date().getFullYear();

        function updateStatus() {
            const completed = loadedCount + failedCount;
            if (completed < totalCount) {
                status.textContent = `ছবি লোড হচ্ছে: ${completed}/${totalCount}`;
            } else if (loadedCount === 0) {
                status.textContent = "কোনো ছবি লোড হয়নি। GitHub-এর images ফোল্ডার ও ফাইলের নাম পরীক্ষা করুন।";
            } else if (failedCount > 0) {
                status.textContent = `${loadedCount}টি ছবি লোড হয়েছে, ${failedCount}টি ছবি লোড হয়নি।`;
            } else {
                status.textContent = `সব ${loadedCount}টি ছবি সফলভাবে লোড হয়েছে।`;
            }
        }

        function showLightbox(imageSource, imageAlt) {
            lightboxImage.src = imageSource;
            lightboxImage.alt = imageAlt;
            lightbox.classList.add("open");
            closeButton.focus();
        }

        function closeLightbox() {
            lightbox.classList.remove("open");
            lightboxImage.src = "";
        }

        closeButton.addEventListener("click", closeLightbox);
        lightbox.addEventListener("click", event => {
            if (event.target === lightbox) closeLightbox();
        });
        document.addEventListener("keydown", event => {
            if (event.key === "Escape") closeLightbox();
        });

        function addImage(file) {
            const fileName = file.name;
            const card = document.createElement("article");
            card.className = "photo-card";

            const img = document.createElement("img");
            img.alt = "স্মৃতির ছবি: " + fileName;
            img.loading = "lazy";
            img.decoding = "async";
            // GitHub থেকে পাওয়া নাম ব্যবহার করে Netlify-তে থাকা ছবির path তৈরি করা হচ্ছে।
            img.src = "/images/" + fileName.split("/").map(encodeURIComponent).join("/");

            const caption = document.createElement("div");
            caption.className = "photo-name";
            caption.textContent = fileName.replace(/\.[^.]+$/, "");

            let finished = false;
            img.addEventListener("load", () => {
                if (finished) return;
                finished = true;
                loadedCount++;
                updateStatus();
            });
            img.addEventListener("error", () => {
                if (finished) return;
                finished = true;
                failedCount++;
                const errorBox = document.createElement("div");
                errorBox.className = "error";
                const message = document.createElement("strong");
                message.textContent = "ছবি লোড করা যায়নি";
                const details = document.createElement("small");
                details.textContent = "ফাইলটি Netlify deploy-তে আছে কি না পরীক্ষা করুন: /images/" + fileName;
                errorBox.append(message, details);
                img.replaceWith(errorBox);
                updateStatus();
                console.error("Image failed to load:", img.src);
            });
            img.addEventListener("click", () => {
                if (img.naturalWidth > 0) showLightbox(img.src, img.alt);
            });
            card.append(img, caption);
            gallery.appendChild(card);
        }

        async function loadGallery() {
            status.textContent = "GitHub থেকে ছবির তালিকা আনা হচ্ছে...";
            try {
                const response = await fetch(GITHUB_API, {
                    headers: { "Accept": "application/vnd.github+json" },
                    cache: "no-store"
                });
                if (!response.ok) {
                    throw new Error(`GitHub API response: ${response.status}`);
                }
                const files = await response.json();
                const images = files
                    .filter(file => file.type === "file" && ALLOWED_IMAGE.test(file.name))
                    .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }));

                if (images.length === 0) {
                    status.textContent = "GitHub-এর images ফোল্ডারে কোনো supported image পাওয়া যায়নি।";
                    return;
                }

                totalCount = images.length;
                status.textContent = `মোট ${totalCount}টি ছবির তালিকা পাওয়া গেছে; লোড হচ্ছে...`;
                images.forEach(addImage);
                updateStatus();
            } catch (error) {
                console.error("Gallery list could not be loaded:", error);
                status.textContent = "GitHub থেকে ছবির তালিকা আনা যায়নি। ইন্টারনেট, repository public কি না, এবং GitHub API rate limit পরীক্ষা করুন।";
            }
        }

        loadGallery();
    </script>

</body>
</html>
